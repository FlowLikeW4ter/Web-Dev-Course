<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relative vs Absolute</title>
  <style>
    .container {
      position: relative;
      width: 300px;
      height: 200px;
      border: 2px solid black;
    }

    .static-box {
    width: 100px;
    height: 100px;
    background-color: rgb(142, 167, 255);
    position: static;
    padding: 0px;
    }

    .relative-box {
      width: 100px;
      height: 100px;
      background-color: lightgreen;
      position: relative;
      top: 20px;
      left: 20px;
      padding: 0px;
    }

    .absolute-box {
      width: 100px;
      height: 100px;
      background-color: tomato;
      position: absolute;
      top: 20px;
      left: 20px;
    }
  </style>
</head>
<body>

  <h2>Relative vs Absolute Positioning</h2>

  <div class="container">
    <div class="static-box">Static</div>
    <div class="relative-box">Relative</div>
    <div class="absolute-box">Absolute</div>
    
  </div>

</body>
</html>
