<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messign around</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            display: flex;
            justify-content: center;

            flex-direction: column;
        }

        <div class="text">
            <h2>Hello</h2>
            <p>world</p>
        </div>
