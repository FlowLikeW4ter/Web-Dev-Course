<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css stuff</title>
    <style>
        /* *{
            margin: 0;
            padding: 0;
        }
        .highlight {
            background-color: yellow;
            font-weight: bold;
        } */
         div > p {
            color: blue;
         }
         div ~ p{
            color: aquamarine;
         }
         .Teto {
            color:  lightcoral;
         }
         div ~ {
            color: yellow;
         }
         section {
            margin-bottom: 2rem;
         }
          /* dont forget to remove this^^^ when actually applying style  */
        
    </style>
</head>
<body> 
    <section>
        <h1>practicing descendants and other elements</h1>
        <p>manadtory paragraph underneath the h1</p>
        <hr>
    </section>
    <!-- so section inside divs are treated as bastard childred -->
    <div>
        <p >direct paragraph</p>
        <section>
            <p >bastard paragraph</p>
        </section>
    </div>
    <div>
        <p class="Miku">Miku</p>
        <p class="Teto">Teto</p>
    </div>
    <div>
        <p>Len</p>
        <p>Rin</p>
    </div>
    <section>
        <table border="5">
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>Jonas</td>
                <td>21</td>
            </tr>
            <tr>
                <td>Barto</td>
                <td>23</td>
            </tr>
        </table>
    </section>
    <section>
        <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/aRGdDy18qfY?si=95Y6Ztf6MIC70CA1"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
></iframe>
    </section>
</body>
</html>
